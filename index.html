<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowy — Snow removal · Chicagoland, IL</title>
<meta name="description" content="Snow removal, shoveling and salt for driveways, walks and patios in Chicago and the suburbs. Get a price before any work starts.">
<meta name="theme-color" content="#1565D8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snowy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a bright sky-to-snow hero with drifting snowfall and a road-sign fact card, over a clean ice-white app shell; one confident blue carries every action. */
  --bg:#F4F8FB; --surface:#FFFFFF; --ink:#0F2233; --muted:#566B7E; --line:#DBE5EE;
  --accent:#1565D8; --on-accent:#FFFFFF; --sky:#DCEEFB;
  --bar:rgba(255,255,255,.92); --hero-a:#D3E9FA; --hero-b:#F4F8FB;
  --info:#1565D8; --violet:#6B4FC4; --teal:#13807A; --warn:#A86A00; --good:#1B8F5A; --crit:#C0352B;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(15,34,51,.05),0 10px 28px rgba(15,34,51,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1620; --surface:#112231; --ink:#E9F1F8; --muted:#9FB3C4; --line:#213647;
    --accent:#4E9BFF; --on-accent:#06121F; --sky:#12293B;
    --bar:rgba(10,22,32,.92); --hero-a:#12344F; --hero-b:#0A1620;
    --info:#6AA8F0; --violet:#A793F0; --teal:#4FCBC3; --warn:#E7B04A; --good:#4CC38A; --crit:#FF7B72;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1620; --surface:#112231; --ink:#E9F1F8; --muted:#9FB3C4; --line:#213647;
  --accent:#4E9BFF; --on-accent:#06121F; --sky:#12293B;
  --bar:rgba(10,22,32,.92); --hero-a:#12344F; --hero-b:#0A1620;
  --info:#6AA8F0; --violet:#A793F0; --teal:#4FCBC3; --warn:#E7B04A; --good:#4CC38A; --crit:#FF7B72;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05;letter-spacing:.01em}
h2{font-size:2rem;font-weight:800;text-transform:uppercase}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.sec{padding-top:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.55rem/1 var(--display);letter-spacing:.02em;min-width:0;flex:1 1 auto}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:28px;height:28px}
.brand b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{margin-left:auto;display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);padding:3px;border-radius:999px}
.nav button{border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;font-weight:600;cursor:pointer;min-height:34px}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);padding:6px 10px;font-weight:700;font-size:.8rem;cursor:pointer;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:38px;padding:0 14px;font-size:.9rem;border-radius:10px}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--crit) 50%,transparent);color:var(--crit)}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:1.3rem;line-height:1}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--hero-a) 0%,var(--hero-b) 100%)}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.drift{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:54px;color:var(--bg);pointer-events:none;display:block}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-top:34px;padding-bottom:74px}
.hero-grid>*{min-width:0}
.kicker{font-weight:700;letter-spacing:.09em;text-transform:uppercase;font-size:.85rem;color:var(--accent)}
.hero-h{font-size:clamp(3rem,14.5vw,7.8rem);font-weight:800;text-transform:uppercase;line-height:.88;margin:10px 0 18px;display:grid}
.hero-h .hi{color:var(--accent)}
.lead{max-width:34rem;font-size:1.125rem;color:color-mix(in srgb,var(--ink) 78%,transparent)}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:22px}
.cta-phone{font-weight:700}
.sign{background:var(--surface);color:var(--ink);border:3px solid var(--accent);border-radius:20px;padding:6px;box-shadow:var(--shadow);align-self:start}
.sign-in{border:2px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:14px;padding:16px 18px}
.sign-t{font:800 1.1rem/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sign-big{font:800 6.2rem/.9 var(--display);margin:8px 0 6px;display:flex;align-items:baseline;gap:8px;color:var(--accent)}
.sign-big small{font-size:1.8rem;letter-spacing:.06em}
.sign-s{font-weight:600}
.sign-dl{margin:14px 0 0;display:grid;gap:10px;border-top:2px solid var(--line);padding-top:12px}
.sign-dl div{display:grid;gap:1px;font-size:1rem}
.sign-dl dt{font-weight:700;text-transform:uppercase;font-size:.75rem;letter-spacing:.1em;color:var(--muted)}
.sign-dl dd{margin:0;font-weight:700}
.trust{display:flex;flex-wrap:wrap;gap:10px 22px;padding-top:4px}
.trust span{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.trust svg{width:20px;height:20px;color:var(--good);flex:none}

/* services */
.svc-grid{display:grid;gap:12px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start}
.svc .ic{width:44px;height:44px;border-radius:11px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);display:grid;place-items:center}
.svc .ic svg{width:26px;height:26px}
.svc p{color:var(--muted);font-size:.95rem}
.svc .from{font:700 1.15rem/1 var(--display);letter-spacing:.02em;margin-top:4px}

/* how */
.how{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.how li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:16px;border-top:3px solid var(--ink)}
.how .n{font:800 3rem/.9 var(--display);grid-row:span 2;color:var(--accent)}
.how h3{text-transform:uppercase}
.how p{color:var(--muted);font-size:.95rem}

/* form */
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.formhead{display:grid;gap:6px;margin-bottom:16px}
.formhead p{color:var(--muted)}
.fgrid{display:grid;gap:14px}
.two{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.fs>legend{font-weight:600;font-size:.88rem;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.field textarea{min-height:92px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid color-mix(in srgb,var(--info) 55%,transparent);outline-offset:0;border-color:var(--info)}
.fs{border:0;padding:0;margin:0;min-width:0}
.fs>legend{padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;cursor:pointer}
.chip input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip input:focus-visible+span{outline:3px solid var(--info);outline-offset:2px}
.est{border:2px dashed var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.est .lbl{font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.est .amt{font:800 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.est .note{font-size:.88rem;color:var(--muted)}
.err{color:var(--crit);font-weight:600;min-height:1.2em}
.formfoot{display:grid;gap:12px}
.done{display:grid;gap:14px}
.done .code{font:800 2.2rem/1 var(--display);letter-spacing:.06em;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:12px 16px;width:fit-content}
.done textarea{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.note-box{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:10px 12px;border-radius:6px;font-size:.92rem}

/* pay */
.pay-grid{display:grid;gap:12px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pay{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start}
.pay h3{text-transform:uppercase}
.pay .handle{font-weight:700;font-size:1.1rem;word-break:break-all}
.pay .mono{font:500 .85rem/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px}
.pay .sub{color:var(--muted);font-size:.92rem}
.qr{width:136px;height:136px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.qr svg{display:block;width:100%;height:100%}
.pay .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{margin-top:40px;background:var(--surface);border-top:1px solid var(--line);padding:24px 0 32px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:.92rem}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.85rem}

/* panel */
.adm{padding-top:20px;padding-bottom:60px}
.adm-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.adm-head h1{font-size:2.4rem;font-weight:800;text-transform:uppercase}
.adm-actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{margin-top:12px;padding:10px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile .k{font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:800 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.tile.hot{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.tools{display:grid;gap:10px;margin-top:16px}
.search{min-height:46px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem;cursor:pointer;min-height:36px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.filters .ct{opacity:.65;font-variant-numeric:tabular-nums;margin-left:4px}
.list{display:grid;gap:10px;margin-top:12px}
.lead-card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%}
.lead-card:hover{border-color:var(--ink)}
.lead-card:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.lead-card.u-now{border-left-color:var(--crit)}
.lead-card.u-24{border-left-color:var(--warn)}
.lead-card .top1{display:flex;justify-content:space-between;gap:10px;align-items:start}
.lead-card strong{font-size:1.05rem}
.lead-card .sub{color:var(--muted);font-size:.92rem}
.lead-card .foot1{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.tag.demo{background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
.pill{--c:var(--muted);display:inline-flex;align-items:center;white-space:nowrap;font-weight:700;font-size:.78rem;padding:2px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.c-info{--c:var(--info)}.c-muted{--c:var(--muted)}.c-violet{--c:var(--violet)}.c-teal{--c:var(--teal)}.c-warn{--c:var(--warn)}.c-good{--c:var(--good)}.c-crit{--c:var(--crit)}
.empty{padding:28px 18px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* gallery */
.jobs-sub{color:var(--muted);margin-top:8px;font-size:1rem}
.job-grid{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.job{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.cmp{position:relative;aspect-ratio:4/3;background:var(--sky);--pos:50%;overflow:hidden}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cmp .bef{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--pos);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cmp .knob{position:absolute;top:50%;left:var(--pos);width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.35);display:grid;place-items:center;font-weight:800;letter-spacing:-2px;pointer-events:none}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp:focus-within{outline:3px solid var(--info);outline-offset:-3px}
.cmp .lbl{position:absolute;bottom:10px;padding:2px 10px;border-radius:999px;background:rgba(10,22,32,.74);color:#fff;font-weight:700;font-size:.75rem;letter-spacing:0;text-transform:none;pointer-events:none}
.cmp .lb{left:10px}.cmp .la{right:10px}
.ribbon{position:absolute;top:10px;left:10px;z-index:3;background:var(--warn);color:#fff;font-weight:700;font-size:.72rem;padding:2px 8px;border-radius:6px}
.job figcaption{padding:12px 14px 14px;display:grid;gap:4px}
.job .loc{display:inline-flex;align-items:flex-start;gap:6px;color:var(--accent);font-weight:600;text-decoration:none}
.job .loc svg{width:17px;height:17px;flex:none;margin-top:3px}
.job .meta{color:var(--muted);font-size:.9rem}
.more{margin-top:14px;display:flex;justify-content:center}
.owner-hint{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;justify-items:start;background:var(--surface)}
.owner-hint span{color:var(--muted)}
.seg{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:12px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 18px;font-weight:700;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.jrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;width:100%;align-items:center}
.jrow:hover{border-color:var(--ink)}
.jrow:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.jrow .th{width:96px;aspect-ratio:4/3;border-radius:8px;background:var(--sky) center/cover no-repeat}
.jrow .jt{display:grid;gap:2px;min-width:0}
.photo-pick{display:grid;gap:8px}
.photo-pick .pv{aspect-ratio:4/3;border-radius:10px;border:2px dashed var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,12,18,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow)}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:1.6rem}
.sheet-b{padding:14px 16px 28px;display:grid;gap:14px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.blk h3{text-transform:uppercase;font-size:1.05rem;letter-spacing:.04em;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.chip-b{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;min-height:40px;font-weight:600;cursor:pointer}
.chip-b.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pmt{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.93rem;border-bottom:1px dashed var(--line);padding:6px 0}
.pmt:last-child{border-bottom:0}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.bal{font:800 1.8rem/1 var(--display);font-variant-numeric:tabular-nums}
.hint{font-size:.85rem;color:var(--muted)}
.warn-t{color:var(--warn);font-weight:600;font-size:.88rem}
.sheet textarea.msg{min-height:150px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}


/* today: weather + crew */
.today{padding-top:30px}
.today-grid{display:grid;gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;box-shadow:var(--shadow)}
.tcard h2{font-size:1.45rem}
.tcard header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.live{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;color:var(--good);text-transform:uppercase;letter-spacing:.08em}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.wxalert{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--crit) 12%,transparent);border:1px solid color-mix(in srgb,var(--crit) 42%,transparent);font-size:.95rem}
.wx-now{display:flex;align-items:center;gap:14px}
.wx-now>svg{width:56px;height:56px;color:var(--accent);flex:none}
.wx-now .deg{font:800 3.3rem/1 var(--display)}
.wx-now .cond{display:grid;gap:2px;font-weight:700}
.wx-now small{color:var(--muted);font-weight:500;font-size:.88rem}
.snowline{font-weight:600;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.snowline.hot{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 42%,transparent)}
.wx-days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wx-days li{display:grid;gap:2px;justify-items:center;text-align:center;padding:8px 4px;border-radius:10px;background:var(--bg);font-size:.88rem;color:var(--muted)}
.wx-days svg{width:26px;height:26px;color:var(--accent)}
.wx-days b{color:var(--ink);font-weight:700}
.src{font-size:.8rem;color:var(--muted)}
.src a{color:var(--accent)}
.crew-s{display:flex;align-items:center;gap:10px;font:700 1.45rem/1.1 var(--display)}
.dot{width:13px;height:13px;border-radius:50%;flex:none;background:var(--muted)}
.dot.open{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.dot.busy{background:var(--warn)}
/* address */
.addr-box{position:relative}
.sug{list-style:none;margin:4px 0 0;padding:4px;position:absolute;z-index:25;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:300px;overflow:auto}
.sug li{padding:10px 12px;border-radius:8px;cursor:pointer;display:grid;gap:1px}
.sug li[aria-selected="true"],.sug li:hover{background:var(--sky)}
.sug small{color:var(--muted)}
.addr-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.area{font-weight:600;font-size:.92rem}
.area.ok{color:var(--good)}.area.out{color:var(--warn)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
/* login */
.lgcard{max-width:420px;margin:30px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;box-shadow:var(--shadow)}
.lgcard h1{font-size:2rem;text-transform:uppercase}
.assign{font-size:.8rem;font-weight:700;color:var(--accent)}
@media (min-width:760px){.today-grid{grid-template-columns:1.3fr 1fr}.today-grid>:only-child{grid-column:1/-1;max-width:640px}}

/* formulario rápido, seguimiento y zonas */
.linkb{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;font-weight:600}
.linkb:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:4px}
.mem{margin:8px 0 0;font-size:.92rem;color:var(--muted)}
.more{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.more>summary{cursor:pointer;list-style:none;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:700}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:'+';font-size:1.5rem;line-height:1;color:var(--muted)}
.more[open]>summary::after{content:'\2212'}
.more>summary:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:12px}
.more-b{display:grid;gap:14px;padding:6px 14px 16px}
.zones{font-size:.92rem;font-weight:600;color:var(--muted)}
.mine{padding-top:18px}
.mine-t{font-size:1.3rem;margin-bottom:8px}
.mine-l{display:grid;gap:8px}
.mine-c{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--info);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.mine-c.live{border-left-color:var(--good)}
.mine-c:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.mine-c>span:first-child{display:grid;gap:2px;min-width:0}
.mine-c small{color:var(--muted);font-size:.92rem}
.mine-c .go{font-weight:700;color:var(--accent);white-space:nowrap}
.trk{padding-top:22px;padding-bottom:40px}
.trk-body{max-width:620px;margin:0 auto}
.trk-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.trk-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.trk-ref{font:700 1.05rem var(--display);letter-spacing:.08em;color:var(--muted)}
.trk-h{font:800 clamp(2rem,8vw,2.8rem)/1.02 var(--display);text-transform:uppercase;margin:0}
.trk-eta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.trk-eta b{font:800 4rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.trk-eta b.now{font-size:2.4rem}
.trk-eta span{color:var(--muted);font-weight:700;font-size:1.2rem}
.trk-sub{margin:0;color:var(--muted);font-weight:600}
.trk-meta{margin:0;font-weight:600}
.steps{list-style:none;margin:6px 0 2px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{display:grid;gap:6px;justify-items:center;text-align:center;font-size:.82rem;font-weight:700;color:var(--muted);position:relative}
.steps li i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:.85rem;position:relative;z-index:1}
.steps li::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.on{color:var(--ink)}
.steps li.on i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps li.on::before{background:var(--accent)}
.steps li.now i{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
/* seguimiento del equipo */
.etas{display:flex;flex-wrap:wrap;gap:8px}
.trk-stage{margin:0;font-weight:700}
.lw{display:grid;gap:6px;align-content:start}
.qs{justify-self:stretch}
.tag.trk{background:color-mix(in srgb,var(--good) 14%,transparent);border-color:color-mix(in srgb,var(--good) 40%,transparent);color:var(--good)}
.gpsbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 14px;background:var(--ink);color:var(--bg);border-radius:14px;box-shadow:var(--shadow);font-weight:600}
.gpsbar .live{color:#7ee2a8}
.gpsbar .live i{background:#7ee2a8}
.gpsbar .btn.ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 45%,transparent)}
@media (min-width:640px){.gpsbar{left:auto;right:20px;width:380px}}
@media (max-width:440px){
  .top .wrap{gap:8px}
  .nav button{padding:7px 10px;font-size:.9rem}
  .lang button{padding:6px 8px}
}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
@media (min-width:760px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tools{grid-template-columns:1fr auto;align-items:center}
  .list{grid-template-columns:1fr 1fr}
  .hero-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px;align-items:center;padding-top:52px;padding-bottom:92px}
  .hero-h{font-size:clamp(3rem,8.2vw,6.8rem)}
  .sign{justify-self:end;width:100%;max-width:360px}
  .formcard{padding:28px}
}
@media (min-width:860px){
  .scrim{align-items:stretch;justify-content:flex-end}
  .sheet{max-height:none;max-width:580px;border-radius:20px 0 0 20px}
}

function mergeCfg(raw){

  c.prices = Object.assign({}, DEF.prices, raw.prices||{});

/* ---------- estimate ---------- */
function estimate(f,p){
  if(f.ptype==='biz' || f.services.indexOf('season')>-1 || f.freq==='season') return {custom:true};
  var mult = {s:1,m:1.5,l:2.2}[f.size]||1, low=0;
  if(f.services.indexOf('driveway')>-1) low += +p['drive_'+f.size]||0;
  if(f.services.indexOf('walks')>-1) low += Math.round((+p.walks||0)*mult);
  if(f.services.indexOf('patio')>-1) low += Math.round((+p.patio||0)*mult);
  if(f.services.indexOf('salt')>-1) low += Math.round((+p.salt||0)*mult);
  if(!low) return {empty:true};
  return {low:low, high:Math.ceil(low*1.25/5)*5};
}
function svcName(id,L){var s=SERVICES.filter(function(x){return x.id===id;})[0];return s?s[L]:id;}
function fromPrice(id,p){
  if(id==='driveway') return +p.drive_s;
  if(id==='walks') return +p.walks; if(id==='patio') return +p.patio; if(id==='salt') return +p.salt;
  return null;
}
function termsText(L){var t=T[L];return {completion:t.tCompletion,before:t.tBefore,days7:t.tDays7}[state.config.terms]||t.tCompletion;}

function sessGet(){var x=lsGet('snowy.sess',null);return (x&&x.token&&x.exp>Date.now())?x:null;}
async function call(action,payload){
  var body=Object.assign({action:action},payload||{}); if(state.token) body.token=state.token;
  try{
    var r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    var j=await r.json();
    if(j&&j.error==='auth'&&state.token) logout(true);
    return j||{ok:false,error:'bad'};
  }catch(e){return {ok:false,error:'network'};}
}

  try{var r=await fetch(API+(API.indexOf('?')>-1?'&':'?')+'action=public'); var j=await r.json(); return (j&&j.ok)?j:null;}catch(e){return null;}
}

async function addLead(lead,key){
  await Promise.race([ready, new Promise(function(r){setTimeout(r,10000);})]);
  if(store.kind==='gas'){
    if(key==='adm'){
      var r1=await call('addLead',{lead:lead}); if(!r1.ok) return {ok:false,err:r1};
      state.leads.unshift(r1.lead); renderPanelParts(); return {ok:true};
    }
    var r2=await call('submitLead',{lead:lead,link:siteLink()});
    if(r2.ok){ if(r2.code) lead.code=r2.code; return {ok:true,tk:(/^[a-f0-9]{12}$/.test(r2.tk||'')?r2.tk:'')}; }
    return {ok:false,err:r2};
  }
  lead.tk=newTk(); state.leads.unshift(lead); lsSet('snowy.leads',state.leads); renderPanelParts();
  return {ok:true,local:true,tk:lead.tk};
}
async function patchLead(id,patch){
  var i = state.leads.findIndex(function(x){return x.id===id;}); if(i<0) return false;
  state.leads[i] = Object.assign({}, state.leads[i], patch);
  renderPanelParts();
  if(store.kind==='gas'){
    state.busy++; var r;
    try{
      var p=(queues[id]||Promise.resolve()).then(function(){return call('patchLead',{id:id,patch:patch});});
      queues[id]=p.catch(function(){}); r=await p;
    } finally { state.busy--; }
    if(!r||!r.ok){ if(!r||r.error!=='auth'){toast('No se pudo guardar. Revisa tu conexión.'); loadPanel(true);} return false; }
    var j=state.leads.findIndex(function(x){return x.id===id;}); if(j>-1) state.leads[j]=r.lead;
    renderPanelParts(); return true;
  }
  lsSet('snowy.leads',state.leads); return true;
}
async function removeLead(id){
  var keep=state.leads;
  state.leads=state.leads.filter(function(x){return x.id!==id;}); renderPanelParts();
  if(store.kind==='gas'){
    var r=await call('deleteLead',{id:id});
    if(!r.ok){state.leads=keep; renderPanelParts(); toast('No se pudo borrar.'); return false;}
  } else lsSet('snowy.leads',state.leads);
  return true;
}
async function saveConfig(cfg){
  if(store.kind==='gas'){
    var r=await call('saveConfig',{config:cfg}); if(!r.ok) return false;
    state.config=mergeCfg(Object.assign({},r.config)); applyConfig(); loadWeather(); return true;
  }
  lsSet('snowy.config',cfg); state.config=mergeCfg(cfg); applyConfig(); loadWeather(); return true;
}

  state.leads=r.leads||[]; sortLeads(); state.jobs=r.jobs||[]; state.jobsLoaded=true; state.panelReady=true;

async function copyText(text,okMsg){
  try{await navigator.clipboard.writeText(text);toast(okMsg||'Copiado');return true;}catch(e){}
  try{var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();if(ok){toast(okMsg||'Copiado');return true;}}catch(e){}
  toast('Selecciona el texto y cópialo a mano.');return false;
}

/* ---------- QR ---------- */
function qrSvg(text){
  try{
    if(typeof qrcode!=='function') return '';
    var q=qrcode(0,'M'); q.addData(text); q.make();
    var n=q.getModuleCount(), d='';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+','+r+'h1v1h-1z';
    var s=n+4;
    return '<svg viewBox="-2 -2 '+s+' '+s+'" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect x="-2" y="-2" width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  }catch(e){return '';}
}

/* snowfall */
function isDark(){var t=document.documentElement.getAttribute('data-theme');return t==='dark'||(t!=='light'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
function snow(){
  var cv=$('#snow'); if(!cv||!cv.getContext) return; var ctx=cv.getContext('2d'), w=0,h=0,fl=[],raf=0;
  function size(){
    var r=cv.parentElement.getBoundingClientRect(); if(!r.width) return; var dpr=Math.min(2,window.devicePixelRatio||1);
    w=cv.width=Math.round(r.width*dpr); h=cv.height=Math.round(r.height*dpr);
    fl=[]; for(var i=0;i<Math.round(r.width/11);i++) fl.push({x:Math.random()*w,y:Math.random()*h,r:(Math.random()*1.7+.6)*dpr,v:(Math.random()*.55+.25)*dpr,d:Math.random()*6.28});
  }
  function draw(step){
    ctx.clearRect(0,0,w,h); var dk=isDark(); ctx.fillStyle=dk?'rgba(255,255,255,.78)':'rgba(255,255,255,.98)'; ctx.shadowColor=dk?'rgba(0,0,0,0)':'rgba(40,110,185,.5)'; ctx.shadowBlur=dk?0:5;
    for(var i=0;i<fl.length;i++){var f=fl[i]; if(step){f.y+=f.v;f.d+=.012;f.x+=Math.sin(f.d)*.45;if(f.y>h+4){f.y=-4;f.x=Math.random()*w;}} ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();}
  }
  function loop(){ if(state.view==='cotizar') draw(true); raf=requestAnimationFrame(loop); }
  size(); draw(false);
  if(!reduceMotion) loop();
  window.addEventListener('resize',function(){size();draw(false);});
  document.addEventListener('visibilitychange',function(){ if(reduceMotion) return; cancelAnimationFrame(raf); if(!document.hidden) loop(); });
}

function stats(){
  var now=new Date(), ms=new Date(now.getFullYear(),now.getMonth(),1).getTime(), o={nuevos:0,agendados:0,porCobrar:0,cobrado:0};
  state.leads.forEach(function(l){
    if(l.status==='nuevo')o.nuevos++; if(l.status==='agendado')o.agendados++;
    if(l.status==='completado')o.porCobrar+=Math.max(0,balanceOf(l));
    (l.payments||[]).forEach(function(p){if(p.at>=ms)o.cobrado+=(+p.amount||0);});

function rank(l){return l.status==='nuevo'?0:l.status==='pagado'?2:l.status==='perdido'?3:1;}
function renderList(){
  var q=state.q.trim().toLowerCase(), qd=digits(q);

    else if(state.filter!=='all'&&l.status!==state.filter)return false;

    return (l.name||'').toLowerCase().indexOf(q)>-1||(l.address||'').toLowerCase().indexOf(q)>-1||(l.city||'').toLowerCase().indexOf(q)>-1||(l.code||'').toLowerCase().indexOf(q)>-1||(qd.length>2&&digits(l.phone).indexOf(qd)>-1);
  }).sort(function(a,b){return rank(a)-rank(b)||(b.createdAt||0)-(a.createdAt||0);});

    var money1=l.quote?(money(l.quote)+(paidOf(l)?' · cobrado '+money(paidOf(l)):'')):'Sin cotizar';
    return '<div class="lw"><button type="button" class="lead-card'+u+'" data-act="open" data-id="'+esc(l.id)+'"><span class="top1"><strong>'+esc(l.name)+'</strong>'+pill(l.status)+'</span><span class="sub">'+esc(l.address)+(l.city?', '+esc(l.city):'')+'</span><span class="tags">'+tags+'</span><span class="foot1"><span>'+esc(ago(l.createdAt||Date.now()))+(l.scheduledFor?' · '+esc(fmtDate(l.scheduledFor,'es')):'')+'</span><span>'+esc(money1)+'</span></span></button>'+qsBtn(l)+'</div>';

function payLines(L){
  var c=state.config, out=[];
  if(c.zelle) out.push('Zelle: '+c.zelle+(c.zelleName?' ('+c.zelleName+')':''));
  if(c.cashtag) out.push('Cash App: $'+String(c.cashtag).replace(/^\$/,''));
  if(c.btc) out.push('Bitcoin (BTC): '+c.btc);
  if(c.cashOK) out.push(L==='es'?'Efectivo en el lugar':'Cash on site');
  return out;
}
function messageFor(l,kind){
  var es=l.lang==='es', c=state.config, brand=c.brand, first=(l.name||'').split(' ')[0]||'', L=es?'es':'en';
  var svc=(l.services||[]).map(function(s){return svcName(s,L);}).join(', '), addr=l.address+(l.city?', '+l.city:'');
  var bal=Math.max(0,balanceOf(l)), q=+l.quote||0, date=fmtDate(l.scheduledFor,L), terms=termsText(L);
  if(kind==='quote'){
    if(!q) return es?'Pon un precio en "Cotización y fecha" para generar este mensaje.':'Pon un precio en "Cotización y fecha" para generar este mensaje.';
    var per=l.freq==='season'?(es?' por la temporada':' for the season'):(es?' por visita':' per visit');
    return es?'Hola '+first+', le escribe '+brand+'. Por '+svc+' en '+addr+', el precio es '+money(q)+per+'.'+(date?' Podemos ir el '+date+'.':'')+' '+terms+' Responda SÍ para confirmar.'
             :'Hi '+first+', this is '+brand+'. For '+svc+' at '+addr+', the price is '+money(q)+per+'.'+(date?' We can come '+date+'.':'')+' '+terms+' Reply YES to confirm.';
  }
  if(kind==='pay'){
    if(!bal) return 'No hay saldo pendiente. Pon un precio o revisa los pagos registrados.';
    var lines=payLines(L); if(!lines.length) lines=[es?'(Agrega tus métodos de pago en Ajustes)':'(Add your payment methods in Settings)'];
    var btc=c.btc?(es?'\nPara Bitcoin, envía el valor en USD al momento de pagar y mándanos el ID de la transacción.':'\nFor Bitcoin, send the USD value at the time you pay and text us the transaction ID.'):'';
    return es?'Hola '+first+', gracias por elegir '+brand+'. Tu saldo es '+money(bal)+'.\nPuedes pagar con:\n'+lines.map(function(x){return '- '+x;}).join('\n')+btc+'\nPor favor pon la dirección '+l.address+' en la nota.'
             :'Hi '+first+', thanks for choosing '+brand+'. Your balance is '+money(bal)+'.\nYou can pay with:\n'+lines.map(function(x){return '- '+x;}).join('\n')+btc+'\nPlease put '+l.address+' in the note.';
  }
  if(kind==='sched'){
    if(!date) return 'Elige la fecha del servicio en "Cotización y fecha" para generar este mensaje.';
    return es?'Hola '+first+', tu servicio de '+svc+' queda agendado para el '+date+' en '+addr+'. Responde aquí si algo cambia. — '+brand
             :'Hi '+first+', your '+svc+' is scheduled for '+date+' at '+addr+'. Reply here if anything changes. — '+brand;
  }
  var pays=(l.payments||[]).map(function(p){return '- '+(PM[p.method]||p.method)+': '+money(p.amount)+(p.ref?' ('+p.ref+')':'');}).join('\n')||'-';
  return es?'Recibo — '+brand+'\nCliente: '+l.name+'\nDirección: '+addr+'\nServicio: '+svc+(date?'\nFecha: '+date:'')+'\nTotal: '+money(q)+'\nPagos:\n'+pays+'\nSaldo: '+money(bal)+'\nGracias por tu confianza.'
           :'Receipt — '+brand+'\nCustomer: '+l.name+'\nAddress: '+addr+'\nService: '+svc+(date?'\nDate: '+date:'')+'\nTotal: '+money(q)+'\nPayments:\n'+pays+'\nBalance: '+money(bal)+'\nThank you for your business.';
}

function compressImage(file,big){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var tries=big?[[1600,.82],[1300,.76],[1000,.7],[800,.6]]:[[1100,.78],[900,.7],[760,.62],[640,.55],[520,.5]], cap=big?900000:225000, last='';
      for(var i=0;i<tries.length;i++){
        var w=Math.min(tries[i][0],img.naturalWidth), h=Math.round(img.naturalHeight*w/img.naturalWidth);
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
        last=cv.toDataURL('image/jpeg',tries[i][1]); if(last.length<=cap) return res(last);
      }
      res(last.length<=cap*1.07?last:null);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'));};
    img.src=url;
  });
}

  es:{clear:'Despejado',cloud:'Nublado',fog:'Niebla',rain:'Lluvia',snow:'Nieve',storm:'Tormenta',zr:'Lluvia helada'}
};

function kindFromText(t){
  t=String(t||'').toLowerCase();
  if(/thunder|t-storm/.test(t)) return 'storm';
  if(/freezing|sleet|ice|wintry/.test(t)) return 'zr';
  if(/snow|flurr|blizzard/.test(t)) return 'snow';
  if(/rain|shower|drizzle/.test(t)) return 'rain';
  if(/fog|haze|mist|smoke/.test(t)) return 'fog';
  if(/cloud|overcast/.test(t)) return 'cloud';
  if(/sunny|clear|fair/.test(t)) return 'clear';
  return 'cloud';
}
var KIND_RANK={clear:0,cloud:1,fog:2,rain:3,zr:4,snow:5,storm:6};
function wxIcon(k){return {clear:'i-sun',cloud:'i-cloud',fog:'i-cloud',rain:'i-rain',zr:'i-rain',snow:'i-snow',storm:'i-rain'}[k]||'i-cloud';}
function nwsUrl(c){return 'https://forecast.weather.gov/MapClick.php?lat='+c.baseLat+'&lon='+c.baseLng;}
function isoDur(d){
  var m=/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?$/.exec(String(d||'')); if(!m) return 0;
  return ((+m[1]||0)*24*60+(+m[2]||0)*60+(+m[3]||0))*60000;
}
function intervals(layer){
  return ((layer&&layer.values)||[]).map(function(v){
    var p=String(v.validTime||'').split('/'), st=Date.parse(p[0]), du=isoDur(p[1]);
    return (isFinite(st)&&du>0&&v.value!=null)?{s:st,e:st+du,v:+v.value}:null;
  }).filter(Boolean);
}
function dayKey(ms,tz){return new Date(ms).toLocaleDateString('en-CA',{timeZone:tz});}
function parseNws(hj,gj,tz,now){
  var per=hj&&hj.properties&&hj.properties.periods; if(!per||!per.length) return null;
  var cur=null; for(var i=0;i<per.length;i++){ if(Date.parse(per[i].endTime)>now){cur=per[i];break;} } if(!cur) return null;
  var F=function(p){return p.temperatureUnit==='C'?p.temperature*9/5+32:p.temperature;};
  var nums=String(cur.windSpeed||'').match(/\d+/g)||[], wind=nums.length?+nums[nums.length-1]:0, temp=Math.round(F(cur)), feels=temp;
  var snow=null, g=gj&&gj.properties;
  if(g){
    var ap=intervals(g.apparentTemperature).filter(function(x){return x.s<=now&&now<x.e;})[0];
    if(ap) feels=Math.round(ap.v*9/5+32);
    var sn=intervals(g.snowfallAmount), mm=0;
    if(g.snowfallAmount){
      sn.forEach(function(x){var o=Math.min(x.e,now+864e5)-Math.max(x.s,now); if(o>0) mm+=x.v*o/(x.e-x.s);});
      snow=Math.round(mm/25.4*10)/10;

  per.forEach(function(p){
    var k=dayKey(Date.parse(p.startTime),tz); if(!byDay[k]){byDay[k]={date:k,hi:-999,lo:999,pop:0,kind:'clear',snow:null};order.push(k);}
    var d=byDay[k], t=F(p), kd=kindFromText(p.shortForecast);

    var pp=p.probabilityOfPrecipitation&&p.probabilityOfPrecipitation.value; if(pp!=null) d.pop=Math.max(d.pop,pp);
    if(KIND_RANK[kd]>KIND_RANK[d.kind]) d.kind=kd;
  });
  if(g&&g.snowfallAmount){
    sn.forEach(function(x){
      var hrs=Math.max(1,Math.round((x.e-x.s)/36e5));
      for(var h=0;h<hrs&&h<200;h++){var t0=x.s+h*36e5, k=dayKey(t0,tz); if(byDay[k]) byDay[k].snow=(byDay[k].snow||0)+x.v/hrs;}
    });
  }
  var days=order.slice(0,3).map(function(k){var d=byDay[k]; return {date:k,kind:d.kind,hi:Math.round(d.hi),lo:Math.round(d.lo),pop:Math.round(d.pop),snow:g&&g.snowfallAmount?Math.round((d.snow||0)/25.4*10)/10:null};});

}

async function setTrackStage(l,stage,extra){

    state.busy++; var r;
    try{r=await call('setTrack',Object.assign({id:l.id,stage:stage,link:siteLink()},extra||{}));} finally{state.busy--;}
    if(!r||!r.ok){ if(!r||r.error!=='auth') toast('No se pudo avisar al cliente. Revisa tu conexión.'); return false; }
    var j=state.leads.findIndex(function(x){return x.id===l.id;}); if(j>-1) state.leads[j]=r.lead;
    if(r.crew) state.crew=r.crew;
    renderPanelParts(); refreshLead(); loadPublic(); toast(okMsg); return true;

  if(stage==='clear') delete L2.track; else {L2.track={stage:stage,by:me,at:now,eta:(stage==='enroute'&&extra&&extra.eta!=null)?extra.eta:null,etaAt:now}; L2.assignee=me;}

/* ubicación en vivo del equipo (solo con la página abierta) */
function gpsEta(l,lat,lng){if(l.lat==null||l.lng==null) return null; return Math.max(1,Math.round(haversine(lat,lng,l.lat,l.lng)*1.3/18*60));}
function renderGpsBar(){
  var el=$('#gpsBar'); if(!el) return;
  if(!gps.id){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML='<span><span class="live"><i></i>GPS</span> Compartiendo con '+esc(gps.code)+(gps.eta!=null?' · '+gps.eta+' min':'')+'</span><button type="button" class="btn ghost small" data-act="stopGps">Detener</button>';
}
async function wakeOn(){
  try{ if(navigator.wakeLock&&gps.id&&!gps.wake){ var w=await navigator.wakeLock.request('screen'); gps.wake=w; w.addEventListener('release',function(){if(gps.wake===w) gps.wake=null;}); } }catch(e){}
}
function startShare(l){
  if(!navigator.geolocation){toast('Tu navegador no permite usar la ubicación.');return false;}
  stopShare(false);
  gps={id:l.id,code:l.code||'',watch:null,last:0,lat:null,lng:null,eta:null,wake:null};
  gps.watch=navigator.geolocation.watchPosition(onGps,function(err){if(err&&err.code===1){toast('Sin permiso de ubicación. Actívalo para compartir.');stopShare(false);}},{enableHighAccuracy:true,maximumAge:8000,timeout:25000});
  wakeOn(); renderGpsBar(); return true;
}
function onGps(pos){
  if(!gps.id) return; gps.lat=pos.coords.latitude; gps.lng=pos.coords.longitude;
  if(Date.now()-gps.last>=20000) sendPing();
}
async function sendPing(){
  var l=state.leads.filter(function(x){return x.id===gps.id;})[0]; if(!l||gps.lat==null) return;
  gps.last=Date.now(); var eta=gpsEta(l,gps.lat,gps.lng); gps.eta=eta; renderGpsBar();
  var body={id:l.id,lat:gps.lat,lng:gps.lng}; if(eta!=null) body.eta=eta;
  var r=await call('ping',body);
  if(r&&!r.ok&&r.error==='not_enroute'){stopShare(false);toast('Se detuvo el GPS. Toca “Voy en camino” otra vez.',4000);}
}
function stopShare(manual){
  if(gps.watch!=null){try{navigator.geolocation.clearWatch(gps.watch);}catch(e){}}
  if(gps.wake){try{gps.wake.release();}catch(e){}}
  var was=gps.id; gps={id:null,code:'',watch:null,last:0,lat:null,lng:null,eta:null,wake:null};
  renderGpsBar();
  if(was){ if(manual) toast('Dejaste de compartir tu ubicación'); if(state.sheet==='lead') refreshLead(); }
}
async function ensureCoords(l){

  try{
    var c=state.config, q=[l.address,l.city,'IL'].filter(Boolean).join(', ');
    var j=await fetchJson('https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=3&lang=en&lat='+c.baseLat+'&lon='+c.baseLng+'&bbox='+bboxStr(c));
    var f=((j&&j.features)||[]).map(sugFrom).filter(Boolean)[0]; if(!f) return null;
    await patchLead(l.id,{lat:f.lat,lng:f.lng}); return {lat:f.lat,lng:f.lng};
  }catch(e){return null;}
}
async function enrouteGps(){
  var l=cur(); if(!l) return;
  if(!navigator.geolocation){toast('Tu navegador no permite usar la ubicación.');return;}
  toast('Buscando tu ubicación…');
  var pos; try{pos=await new Promise(function(ok,no){navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000,maximumAge:30000});});}
  catch(e){toast('No pudimos usar tu ubicación. Usa los minutos de arriba.',3500);return;}
  var c=await ensureCoords(l), eta=c?Math.max(1,Math.round(haversine(pos.coords.latitude,pos.coords.longitude,c.lat,c.lng)*1.3/18*60)):null;
  var l1=state.leads.filter(function(x){return x.id===l.id;})[0]||l;
  var ok=await setTrackStage(l1,'enroute',eta!=null?{eta:eta}:{}); if(!ok) return;

  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume();
    [0,0.24].forEach(function(d,i){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain(), t0=audioCtx.currentTime+d; o.type='sine'; o.frequency.value=i?1046:784;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0+0.24);
    });
  }catch(e){}
}

function lsDel(k){try{localStorage.removeItem(k);}catch(e){} delete mem[k];}
function memGet(){var m=lsGet('snowy.me',null);return (m&&typeof m==='object')?m:null;}
function rememberMe(f){lsSet('snowy.me',{name:f.name.trim(),phone:f.phone.trim(),email:f.email.trim(),address:f.address.trim(),city:(f.city||'').trim(),zip:(f.zip||'').trim(),lat:f.lat,lng:f.lng,distMi:f.distMi,inArea:f.inArea,contact:f.contact});}
function forgetMe(){lsDel('snowy.me');lsDel('snowy.mine');state.mine=[];state.mineData={};forms.pub=blankForm('pub');renderPubForm();renderMine();toast(T[state.lang].qForgot);}
function siteLink(){try{var u=location.origin+location.pathname;return /^https:/.test(u)?u:'';}catch(e){return '';}}
function newTk(){var s='',a=null;try{a=new Uint8Array(6);crypto.getRandomValues(a);}catch(e){a=null;}for(var i=0;i<6;i++){var n=a?a[i]:Math.floor(Math.random()*256);s+=('0'+n.toString(16)).slice(-2);}return s;}
function pageTitle(){var c=state.config,L=state.lang;return c.brand+(L==='es'?' — Remoción de nieve':' — Snow removal')+(c.area?' · '+c.area:'');}
function parseHash(){var h='';try{h=location.hash.replace('#','');}catch(e){}var m=/^t=([a-f0-9]{12})$/.exec(h);return m?{v:'track',tk:m[1]}:{v:h};}

function zoneFor(city,zip){
  var c=String(city||'').trim().toLowerCase(), z=String(zip||'').trim().slice(0,5), list=(state.config&&Array.isArray(state.config.zones))?state.config.zones:[];
  for(var i=0;i<list.length;i++){var pl=(list[i]&&list[i].places)||[];for(var j=0;j<pl.length;j++){var p=String(pl[j]).trim().toLowerCase();if(p&&((c&&p===c)||(z&&p===z))) return list[i].name;}}
  return '';
}
function zonesText(zs){return (Array.isArray(zs)?zs:[]).map(function(z){return z.name+': '+(z.places||[]).join(', ');}).join('\n');}
function parseZones(txt){
  return String(txt||'').split(/\n+/).map(function(line){
    var i=line.indexOf(':'); if(i<1) return null;
    var name=line.slice(0,i).trim(), places=line.slice(i+1).split(',').map(function(x){return x.trim();}).filter(Boolean);
    return (name&&places.length)?{name:name,places:places}:null;
  }).filter(Boolean);
}

/* mis solicitudes (solo en este dispositivo) */
function normMine(a){
  var now=Date.now(); if(!Array.isArray(a)) return [];
  return a.filter(function(m){return m&&/^[a-f0-9]{12}$/.test(m.tk||'')&&(+m.at||0)>now-14*86400000;}).slice(0,5);
}
function addMine(lead,tk){
  var arr=state.mine.filter(function(x){return x.tk!==tk;});
  arr.unshift({tk:tk,code:lead.code||'',at:Date.now()}); state.mine=arr.slice(0,5); lsSet('snowy.mine',state.mine);
}
function noteMine(d,tk){
  state.mineData[tk]=d;
  var m=state.mine.filter(function(x){return x.tk===tk;})[0];
  if(!m){state.mine.unshift({tk:tk,code:d.code||'',at:Date.now()}); state.mine=state.mine.slice(0,5);} else if(d.code) m.code=d.code;
  lsSet('snowy.mine',state.mine);
}
function dropMine(tk){state.mine=state.mine.filter(function(x){return x.tk!==tk;}); delete state.mineData[tk]; lsSet('snowy.mine',state.mine);}

function localTrack(tk){
  var l=(state.leads||[]).filter(function(x){return x.tk===tk;})[0]; if(!l) return {ok:false,error:'not_found'};
  var now=Date.now(), tr0=l.track, stage;
  if(l.status==='pagado') stage='paid'; else if(l.status==='perdido') stage='closed'; else if(l.status==='completado') stage='done';
  else if(tr0&&TRK_STEP[tr0.stage]!=null&&now-tr0.at<6*3600000) stage=tr0.stage; else stage=l.status==='nuevo'?'received':'confirmed';
  var eta=null, arrive=null;
  if(stage==='enroute'&&tr0&&tr0.eta!=null){var base=tr0.etaAt||tr0.at; eta=Math.max(0,Math.round(tr0.eta-(now-base)/60000)); arrive=now+eta*60000;}
  return {ok:true,now:now,code:l.code,stage:stage,first:String(l.name||'').split(' ')[0],lang:l.lang,services:l.services||[],quote:l.quote==null?null:l.quote,paid:paidOf(l),
    crew:(tr0&&stage!=='received'&&stage!=='confirmed')?tr0.by:'',since:tr0?tr0.at:(l.createdAt||0),zone:l.zone||'',eta:eta,arrive:arrive,live:false,distMi:null};
}
async function fetchTrack(tk){
  if(!GAS){await ready; return localTrack(tk);}
  try{var r=await fetch(API+(API.indexOf('?')>-1?'&':'?')+'action=track&t='+encodeURIComponent(tk)); var j=await r.json(); return j||{ok:false,error:'bad'};}
  catch(e){return {ok:false,error:'network'};}
}
async function loadMine(){
  var list=state.mine.slice(0,3); if(!list.length){renderMine();return;}
  await Promise.all(list.map(async function(m){
    var d=await fetchTrack(m.tk);
    if(d&&d.ok){d._skew=(+d.now||Date.now())-Date.now(); state.mineData[m.tk]=d; if(d.code) m.code=d.code;}
    else if(d&&d.error==='not_found') dropMine(m.tk);
  }));
  lsSet('snowy.mine',state.mine); renderMine();
}
function renderMine(){
  var host=$('#mine'); if(!host) return;
  var now=Date.now(), list=state.mine.filter(function(m){
    var d=state.mineData[m.tk], fin=d&&(d.stage==='done'||d.stage==='paid'||d.stage==='closed');
    return !(fin&&now-(d.since||m.at)>48*3600000);
  }).slice(0,2);
  if(!list.length){host.hidden=true;host.innerHTML='';return;}
  var t=T[state.lang];
  host.innerHTML='<h2 class="mine-t">'+esc(t.mineT)+'</h2><div class="mine-l">'+list.map(function(m){
    var d=state.mineData[m.tk], st=d?d.stage:'', line=d?tr('st_'+st,{crew:d.crew||t.trkCrew}):'…';
    if(d&&st==='enroute'&&d.arrive!=null) line+=' · '+tr('trkEtaMin',{n:Math.max(0,Math.ceil((d.arrive-(now+(d._skew||0)))/60000))});
    return '<button type="button" class="mine-c'+(st==='enroute'?' live':'')+'" data-act="openTrack" data-tk="'+esc(m.tk)+'"><span><strong>'+esc(m.code||'')+'</strong><small>'+esc(line)+'</small></span><span class="go">'+esc(t.mineView)+' &rsaquo;</span></button>';
  }).join('')+'</div>';
  host.hidden=false;
}

/* página de seguimiento */
var TRK_STEP={received:0,confirmed:0,enroute:1,arrived:2,working:2,done:3,paid:3};
var trkTimer=null;
function fmtClock(ts,L){try{return new Date(ts).toLocaleTimeString(L==='es'?'es-US':'en-US',{hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function contactRow(t){
  var ph=digits(state.config.phone); if(!ph) return '';
  return '<div class="row"><a class="btn" href="tel:'+esc(ph)+'">'+esc(t.trkCall)+'</a><a class="btn ghost" href="sms:'+esc(ph)+'">'+esc(t.trkText)+'</a></div>';
}
function startTrack(tk){
  stopTrack(); state.trk={tk:tk,data:null,err:'',at:0,skew:0,loading:false,offline:false,html:'',said:''};
  renderTrack(); loadTrack(); trkTimer=setInterval(trkTick,5000);
}
function stopTrack(){if(trkTimer){clearInterval(trkTimer);trkTimer=null;}}
function trkTick(){
  if(state.view!=='track'){stopTrack();return;}
  renderTrack();
  var s=state.trk; if(!s||document.hidden) return;
  var st=s.data&&s.data.stage, every=(st==='paid'||st==='closed')?60000:(st==='done'?30000:10000);
  if(Date.now()-s.at>=every) loadTrack();
}
async function loadTrack(){
  var s=state.trk; if(!s||s.loading) return; s.loading=true;
  var d=await fetchTrack(s.tk); s.loading=false; if(state.trk!==s) return;
  s.at=Date.now();
  if(d&&d.ok){
    var prev=s.data&&s.data.stage; s.data=d; s.err=''; s.offline=false; s.skew=(+d.now||Date.now())-Date.now(); noteMine(d,s.tk);
    if(prev&&prev!==d.stage){try{if(navigator.vibrate) navigator.vibrate([200,100,200]);}catch(e){}}
  } else if(d&&d.error==='not_found'){s.data=null;s.err='not_found';dropMine(s.tk);}
  else if(s.data) s.offline=true; else s.err='network';
  renderTrack();
}
function renderTrack(){
  var host=$('#trk-body'); if(!host||state.view!=='track') return;
  var L=state.lang, t=T[L], s=state.trk||{}, d=s.data, h='';
  var back='<div class="row"><button class="btn ghost small" type="button" data-act="nav" data-v="cotizar">'+esc(t.trkBack)+'</button></div>';
  if(!d){
    if(s.err==='not_found') h='<div class="trk-card"><h1 class="trk-h">'+esc(t.trkNF)+'</h1><p>'+esc(t.trkNFs)+'</p>'+contactRow(t)+back+'</div>';
    else h='<div class="trk-card"><p role="status">'+esc(s.err==='network'?t.trkNet:t.trkLoading)+'</p>'+(s.err==='network'?'<div class="row"><button class="btn" type="button" data-act="trkRetry">'+esc(t.trkRetry)+'</button></div>':'')+back+'</div>';
  } else {
    var st=d.stage, now=Date.now()+(s.skew||0), cur=TRK_STEP[st];
    var mins=(st==='enroute'&&d.arrive!=null)?Math.max(0,Math.ceil((d.arrive-now)/60000)):null;
    var head=tr('st_'+st,{crew:d.crew||t.trkCrew});
    h='<div class="trk-card"><div class="trk-top"><span class="trk-ref">'+esc(tr('trkRef',{code:d.code}))+'</span>'+((st==='enroute'&&d.live)?'<span class="live"><i></i>'+esc(t.wxLive)+'</span>':'')+'</div>';
    h+='<h1 class="trk-h">'+esc(head)+'</h1>';
    if(mins!=null){
      h+='<div class="trk-eta">'+(mins>0?'<b>'+mins+'</b><span>'+esc(t.trkMin)+'</span>':'<b class="now">'+esc(t.trkNow)+'</b>')+'</div>';
      var parts=[]; if(mins>0) parts.push(tr('trkArrive',{time:fmtClock(d.arrive,L)})); if(d.distMi!=null) parts.push(tr('trkDist',{n:d.distMi}));
      if(parts.length) h+='<p class="trk-sub">'+esc(parts.join(' · '))+'</p>';
    } else if(st==='enroute'&&d.distMi!=null) h+='<p class="trk-sub">'+esc(tr('trkDist',{n:d.distMi}))+'</p>';
    h+='<p class="trk-sub">'+esc(t['sub_'+st])+'</p>';
    if(cur!=null) h+='<ol class="steps" aria-label="'+esc(t.trkSteps)+'">'+[1,2,3,4].map(function(n,i){
      return '<li class="'+(i<=cur?'on':'')+((i===cur&&cur<3)?' now':'')+'"'+(i===cur?' aria-current="step"':'')+'><i>'+((i<cur||(i===cur&&cur===3))?'&#10003;':n)+'</i><span>'+esc(t['stp'+n])+'</span></li>';
    }).join('')+'</ol>';
    var meta=[]; if(d.services&&d.services.length) meta.push(d.services.map(function(x){return svcName(x,L);}).join(', '));
    if(d.zone) meta.push(tr('zoneIn',{z:d.zone})); if(d.quote!=null) meta.push(t.trkQuote+' '+money(d.quote)); if(d.paid>0) meta.push(t.trkPaidAmt+' '+money(d.paid));
    if(meta.length) h+='<p class="trk-meta">'+meta.map(function(x){return esc(x);}).join(' · ')+'</p>';
    if(st==='done') h+='<div class="row"><button class="btn" type="button" data-act="topay">'+esc(t.trkPay)+'</button></div>';
    h+=contactRow(t);
    h+='<p class="src">'+esc(tr('trkUpd',{ago:agoL(s.at,L)}))+(s.offline?' · '+esc(t.trkOff):'')+'</p>';
    var ins=installHtml(L); if(ins) h+='<p class="trk-meta">'+ins+'</p>';
    var fin=(st==='done'||st==='paid'||st==='closed');
    h+='<div class="row"><button class="btn ghost small" type="button" data-act="nav" data-v="cotizar">'+esc(fin?t.trkNew:t.trkBack)+'</button></div></div>';
    document.title=head+' · '+state.config.brand;
    var say=$('#trk-say'); if(say&&s.said!==st){s.said=st;say.textContent=head;}
  }
  if(s.html!==h){s.html=h;host.innerHTML=h;}
}

/* ---------- instalar como app ---------- */
var installEv=null;
function isStandalone(){try{return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}catch(e){return false;}}
function isIos(){return /iphone|ipad|ipod/i.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function installHtml(L){
  var t=T[L]; if(isStandalone()) return '';
  if(installEv) return '<button type="button" class="linkb" data-act="install">'+esc(t.instBtn)+'</button>';
  if(isIos()) return '<span class="hint">'+esc(t.instIos)+'</span>';
  return '';
}
async function doInstall(){
  if(!installEv) return; var ev=installEv;
  try{ev.prompt(); await ev.userChoice;}catch(e){}
  installEv=null; renderFoot(); renderTrack(); if(state.view==='panel') renderTeam();
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEv=e;renderFoot();renderTrack();if(state.view==='panel') renderTeam();});
window.addEventListener('appinstalled',function(){installEv=null;renderFoot();renderTrack();if(state.view==='panel') renderTeam();});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}

/* ---------- routing ---------- */

function go(v,fromHash,tk){
  if(v==='track'&&!/^[a-f0-9]{12}$/.test(tk||'')) v='cotizar';
  state.view=v==='panel'?'panel':(v==='track'?'track':'cotizar');
  var pub=state.view==='cotizar', trk=state.view==='track', adm=state.view==='panel';
  $('#pub').hidden=!pub; $('#adm').hidden=!adm; $('#trk').hidden=!trk;
  $('#navQuote').setAttribute('aria-current',pub?'page':'false');
  $('#navPanel').setAttribute('aria-current',adm?'page':'false');
  $('#langBox').hidden=adm;
  $('#navPanel').hidden=GAS&&!adm;
  $('#navQuote').setAttribute('data-act',GAS&&pub?'toform':'nav');
  $('#navQuote').textContent = adm ? 'Cotizar' : T[state.lang].navQuote;
  if(trk) startTrack(tk); else {stopTrack(); document.title=pageTitle();}
  if(!adm) renderMine();
  lsSet('snowy.view',adm?'panel':'cotizar');
  if(adm) showPanel();
  window.scrollTo(0,0);
  if(!fromHash){try{var want=trk?'t='+tk:state.view; if(location.hash.replace('#','')!==want)location.hash=want;}catch(e){}}
}
window.addEventListener('hashchange',function(){
  var hp=parseHash();
  if(hp.v==='track'){if(state.view!=='track'||!state.trk||state.trk.tk!==hp.tk) go('track',true,hp.tk);}
  else if(hp.v==='panel'||hp.v==='cotizar'){if(hp.v!==state.view) go(hp.v,true);}
  else if(/^t=/.test(hp.v)) go('cotizar',true);
});

/* ---------- connect ---------- */
function sortLeads(){state.leads.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});}

function connectLocal(){
  store.kind='local'; state.backend='local'; state.canWrite=true; state.canAdmin=true;
  state.me={name:'Yo',role:'owner'}; state.team=[{name:'Yo',role:'owner'}];
  state.config=mergeCfg(lsGet('snowy.config',{})); state.leads=lsGet('snowy.leads',[]); sortLeads();
  state.jobs=lsGet('snowy.jobs',[]); state.jobsLoaded=true; state.crew=lsGet('snowy.crew',[]); state.crewPub=state.crew;
  applyConfig(); readyResolve(); if(state.view==='panel') showPanel();
}
async function connectGas(){
  store.kind='gas'; state.backend='gas'; state.canWrite=false; state.canAdmin=false; readyResolve();
  var sess=sessGet(); if(sess){state.token=sess.token; state.me={name:sess.name,role:sess.role};}
  loadPublic(); setInterval(function(){if(!document.hidden) loadPublic();},120000);
  if(state.token){ await loadPanel(); if(state.token) startPolling(); }
  else if(state.view==='panel') showPanel();
}
function connect(){ startWeather(); return GAS?connectGas():connectLocal(); }

/* ---------- boot ---------- */

function boot(saved){
  saved=saved||{};
  state.dl=makeDl();
  var cp=GAS?lsGet('snowy.pub',null):null;
  if(cp){state.config=mergeCfg(cp.config||{}); state.jobs=cp.jobs||[]; state.jobsLoaded=true; state.crewPub=cp.crew||[];}
  else state.config=mergeCfg(GAS?{}:lsGet('snowy.config',{}));
  applyConfig(); snow();
  var hp=parseHash();
  go(hp.v==='track'||hp.v==='panel'||hp.v==='cotizar'?hp.v:(GAS?'cotizar':(lsGet('snowy.view','cotizar')==='panel'?'panel':'cotizar')),true,hp.tk);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden||!GAS) return;
    loadPublic(); if(state.token&&state.view==='panel') loadPanel(true);
    if(state.view==='cotizar'&&state.mine.length) loadMine();
    if(state.view==='track') loadTrack();
    if(gps.id) wakeOn();
  });
  connect(); loadMine();
  setInterval(function(){if(!document.hidden&&state.view==='cotizar'&&state.mine.length) loadMine();},30000);
}
boot({});
})();
</script>
